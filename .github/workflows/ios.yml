# The iOS app: an unsigned .ipa for sideloading (docs/ios.md). Runs on every push, on pull requests and by hand
# (Actions > iOS > Run workflow). The .ipa is in the run's artifacts as iWW-iOS (a zip holding iWW.ipa).
# No game data is used or needed here: the player adds their own copy of the game on the device.
name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    name: iOS app (unsigned .ipa)
    # (an Intel Mac: GitHub's Apple-silicon Macs are often short of capacity, and the jobs then never start; Xcode
    # builds for the iPhone from either)
    runs-on: macos-15-intel
    env:
      SDL_TAG: release-2.32.10
      IOS_MIN: "12.0"  # (the oldest Xcode 16 builds for)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        id: tools
        run: |
          brew install ninja
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
          echo "xcode=$(xcodebuild -version | head -n 1 | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      - name: Check the touch controls
        run: |
          mkdir -p build
          cc -O1 -Wall -Imodern/host/ios modern/host/ios/tests/touch_controls_test.c modern/host/ios/touch_controls.c -o build/touch_controls_test
          build/touch_controls_test

      - name: Check the sound of a stream
        run: |
          S=modern/host/snd7
          cc -O1 -Wall -I$S -Imodern/host -Iinclude $S/tests/stream_test.c $S/spu.c $S/driver.c $S/channel.c \
            $S/exchannel.c $S/seq.c -lm -o build/stream_test
          build/stream_test

      - name: Check the Wiimmfi access point's network
        run: |
          cc -O1 -Wall -Imodern/host -Iinclude modern/host/tests/net_nat_test.c modern/host/net_nat.c -lpthread \
            -o build/net_nat_test
          # (its lines also as annotations: what happened is readable without the log)
          set -o pipefail
          rc=0
          build/net_nat_test 2>&1 | tee build/net_nat_test.txt || rc=$?  # (it gives up by itself after 90 s)
          if [ $rc -ne 0 ]; then head -n 20 build/net_nat_test.txt | sed 's/^/::warning::/'; fi
          exit $rc

      - name: Restore SDL2 for iOS
        id: sdl
        uses: actions/cache@v4
        with:
          path: build/SDL2-ios
          key: sdl2-ios-${{ env.SDL_TAG }}-${{ env.IOS_MIN }}-${{ steps.tools.outputs.xcode }}-v1

      - name: Build SDL2 for iOS
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git build/SDL2-src
          cmake -S build/SDL2-src -B build/SDL2-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_MIN" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/SDL2-ios"
          cmake --build build/SDL2-build
          cmake --install build/SDL2-build
          test -f build/SDL2-ios/lib/libSDL2.a

      - name: Configure
        run: python3 tools/configure_host.py --os ios --ios-min "$IOS_MIN" --sdl2 "$GITHUB_WORKSPACE/build/SDL2-ios"

      - name: Build
        run: ninja -f build_host_ios.ninja

      - name: Check the program
        run: |
          file build/hostios_usa/acww
          python3 tools/ios_check.py build/hostios_usa/acww

      - name: Code for crash reports
        # (the instructions of functions named in crash reports from devices, as an annotation: acww-log.txt names a
        # function and an offset; the log isn't readable here otherwise)
        run: |
          for f in ghiNewPost; do
            out=$(xcrun objdump --no-show-raw-insn --disassemble-symbols=_$f build/hostios_usa/acww | tail -n +5 | head -150 \
                  | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/%0A/g') || true
            echo "::notice title=$f::$out"
          done

      - name: Package
        run: |
          python3 tools/ios_package.py build/hostios_usa/acww build/ios/iWW.ipa \
            --version "1.0" --build "${{ github.run_number }}" --min-ios "$IOS_MIN" --commit "${GITHUB_SHA::7}" --sign-adhoc
          unzip -l build/ios/iWW.ipa
          codesign --verify --verbose build/ios/Payload/iWW.app
          plutil -lint build/ios/Payload/iWW.app/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: iWW-iOS
          path: build/ios/iWW.ipa
          if-no-files-found: error
