# Temporary: hands the build's base ROM to the maintainer's test machine, encrypted with its public key (only that
# machine can read it). Run by hand; removed after use.
name: Test data
on: workflow_dispatch
permissions:
  contents: write
jobs:
  xfer:
    runs-on: ubuntu-latest
    env:
      BASEROM_URL: ${{ secrets.BASEROM_URL }}
    steps:
      - name: Fetch, encrypt, push
        run: |
          set -e
          curl -sSfL "$BASEROM_URL" -o rom.nds
          echo "77fde3e30e1e6068395d1f96ea63be569b61c351  rom.nds" | sha1sum -c -
          cat > k.pub <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA4uVk7K2xfQ19dAD3EcEI
          G8Es7t+qGOdvK1aPja0CLnG9fQG7YrF7/EmyEW+Dx2uILRMjjHuJqjD5bDmE0/4a
          liCm3lypd3K6LWnpoyl1D4w2kVmWDDQiOB/hiJlgxUDmD8gcHl62/+hg0NtJSedM
          NvkNEjDZg5oy2jFTqkMs5ckwOrHrN/RPnxTWY7uCnn0+ILwzBkQltC21oFURzokG
          pJ7y0pI1bPGyqQBFP8tD8aCa0pOwTPzQHfLiEPEQw8QLrKqqnbRAcAkOPDuAISWw
          fHHYmVpE7bB6RGd54SonIrPCO2wwJ5uwejoBV4J3p040/hwgfcBmVQewP9+BC7jh
          cQs2TnwblrWjcgR1dJhGWtByaY+gi17igFc+AxXQ3Qi4+Fy2B+cUDCbXS5ds/TOA
          ZiFNFyOaW9DlTVB47C4/IREwA9ULwpHTlzlIfnfgxppkXgfMJS40ztSm5si3QO/D
          whw9IiUig2exa64jTaKvnW2Vs5gyy2ZPzN5UuFmIODQnBTzKOLtb4Dxepir59jl5
          iiDGfyjWrTT+wf4iohDhicIovntZ/hOc95jJl7ILid8iSUqQPlQWaMTuT/9hTIKY
          4A5TU9C+lVWtlMK90O+/F5AB69ZojLqx+CaCg+s+dpAf4mt1Mhvq0AaoUkwfZpWv
          G17zdMLMJVL4K0K0vjmVN9UCAwEAAQ==
          -----END PUBLIC KEY-----
          KEY
          sed -i 's/^ *//' k.pub
          mkdir out
          openssl rand -hex 32 > key.txt
          openssl pkeyutl -encrypt -pubin -inkey k.pub -pkeyopt rsa_padding_mode:oaep -in key.txt -out out/key.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:key.txt -in rom.nds -out out/rom.bin
          cd out
          git init -q -b xfer-tmp
          git config user.name ci; git config user.email ci@localhost
          git add . && git commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" xfer-tmp
